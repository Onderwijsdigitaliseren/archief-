<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NACHTTREIN 212 — Amsterdam · Wenen</title>
<style>
:root{
  --nacht:#0c1220;
  --nacht-d:#070b14;
  --hout-d:#2c1f13;
  --hout:#42301c;
  --hout-l:#5a4226;
  --messing:#b8935a;
  --messing-l:#d4b076;
  --fluweel:#5e2230;
  --fluweel-l:#7a3242;
  --papier:#e9ddc0;
  --papier-d:#d8c9a4;
  --inkt:#251f16;
  --stempel:#8e2a22;
  --sneeuw:#e6edf5;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--nacht-d);
  font-family:"Courier New",Courier,monospace;
  color:var(--papier);
  overflow:hidden;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
/* ---------- kop ---------- */
#kop{
  flex:0 0 auto;display:flex;align-items:baseline;gap:14px;
  padding:10px 18px 8px;
  background:linear-gradient(180deg,#131b2c 0%,var(--nacht) 100%);
  border-bottom:1px solid rgba(184,147,90,.35);
}
#kop h1{
  font-family:Georgia,"Times New Roman",serif;font-weight:600;
  letter-spacing:.28em;font-size:15px;color:var(--messing-l);
  text-transform:uppercase;white-space:nowrap;
}
#kop .route{font-size:11px;color:#8fa0b8;letter-spacing:.12em}
#kop .rechts{margin-left:auto;display:flex;gap:8px;align-items:center}
#klok{
  font-size:14px;color:var(--papier);
  border:1px solid rgba(184,147,90,.45);
  padding:2px 10px;border-radius:2px;
  background:rgba(0,0,0,.3);letter-spacing:.15em;
}
.kopknop{
  font-family:inherit;font-size:11px;letter-spacing:.1em;
  color:var(--messing-l);background:rgba(184,147,90,.08);
  border:1px solid rgba(184,147,90,.45);border-radius:2px;
  padding:5px 12px;cursor:pointer;
}
.kopknop:hover,.kopknop:focus-visible{background:rgba(184,147,90,.2);outline:none}
.kopknop:focus-visible{box-shadow:0 0 0 2px rgba(212,176,118,.5)}
.kopknop[aria-pressed="true"]{background:rgba(184,147,90,.3);color:#fff}
/* ---------- scene ---------- */
#scenewrap{flex:1 1 auto;position:relative;overflow:hidden}
#schok{position:absolute;inset:0}
#schok.wissel{animation:wisselklap .5s ease-out 1}
@keyframes wisselklap{
  0%{transform:translateY(0)}18%{transform:translateY(3px) translateX(-1px)}
  40%{transform:translateY(-2px)}70%{transform:translateY(1px)}100%{transform:translateY(0)}
}
#scene{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;animation:deinen 4.6s ease-in-out infinite}
#scene::-webkit-scrollbar{display:none}
@keyframes deinen{
  0%,100%{transform:translateY(0) rotate(0deg)}
  30%{transform:translateY(-1.5px) rotate(.08deg)}
  65%{transform:translateY(1px) rotate(-.06deg)}
}
.wagonscene{position:relative;height:100%;aspect-ratio:1200/620;min-width:100%}
.wagonscene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
/* SVG-animaties */
.lampzwaai{transform-box:fill-box;transform-origin:50% 0;animation:zwaai 5.2s ease-in-out infinite}
.lampzwaai.traag{animation-duration:7s;animation-delay:-2s}
@keyframes zwaai{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.gloed{animation:gloei 3.4s ease-in-out infinite}
@keyframes gloei{0%,100%{opacity:.75}50%{opacity:1}}
.flakker{animation:flakkeren 9s steps(1) infinite}
@keyframes flakkeren{
  0%,100%{opacity:1}41%{opacity:1}42%{opacity:.55}43%{opacity:1}
  44%{opacity:.7}45%{opacity:1}78%{opacity:1}79%{opacity:.6}80%{opacity:1}
}
.sneeuwbaan{animation:sneeuwdrift 2.4s linear infinite}
.sneeuwbaan.snel{animation-duration:1.15s}
@keyframes sneeuwdrift{from{transform:translate(0,0)}to{transform:translate(-160px,60px)}}
.palen{animation:palenrij 2.8s linear infinite}
@keyframes palenrij{from{transform:translateX(0)}to{transform:translateX(-400px)}}
.heuvels{animation:heuvelrij 14s linear infinite}
@keyframes heuvelrij{from{transform:translateX(0)}to{transform:translateX(-600px)}}
.verlicht{animation:raamgloed 11s linear infinite}
@keyframes raamgloed{0%,86%{opacity:0}89%{opacity:.9}100%{opacity:0}}
.stoompluim{animation:stoom 6s ease-in-out infinite}
@keyframes stoom{0%{opacity:0;transform:translate(0,0) scale(.7)}25%{opacity:.35}100%{opacity:0;transform:translate(-120px,-46px) scale(1.5)}}
.wieldraai{transform-box:fill-box;transform-origin:center;animation:draai 1.1s linear infinite}
@keyframes draai{to{transform:rotate(360deg)}}
.dampje{animation:damp 4.2s ease-in-out infinite}
@keyframes damp{0%{opacity:0;transform:translateY(0)}30%{opacity:.5}100%{opacity:0;transform:translateY(-26px)}}
@media (prefers-reduced-motion:reduce){
  #scene,.lampzwaai,.gloed,.flakker,.sneeuwbaan,.palen,.heuvels,.verlicht,.stoompluim,.wieldraai,.dampje{animation:none !important}
}
/* ---------- klikbare overlays boven de SVG ---------- */
.kliklaag{position:absolute;inset:0}
.klik{
  position:absolute;cursor:pointer;background:transparent;border:0;
  min-width:44px;min-height:44px;touch-action:manipulation;
}
.klik:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(212,176,118,.85);border-radius:4px}
.klik:hover{box-shadow:inset 0 0 0 2px rgba(212,176,118,.45);border-radius:4px}
.klik .tip{
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.08em;color:var(--papier);
  background:rgba(7,11,20,.94);border:1px solid rgba(184,147,90,.5);
  padding:3px 9px;border-radius:2px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .15s;z-index:5;
}
.klik:hover .tip,.klik:focus-visible .tip{opacity:1}
.klik .mark{
  position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  width:11px;height:11px;border-radius:50%;
  border:2px solid var(--messing-l);background:rgba(212,176,118,.14);
  box-shadow:0 0 10px rgba(212,176,118,.4);
  animation:pols 2.6s ease-in-out infinite;pointer-events:none;
}
@keyframes pols{0%,100%{transform:translateX(-50%) scale(1);opacity:.8}50%{transform:translateX(-50%) scale(1.3);opacity:1}}
.klik.gedaan .mark{animation:none;border-color:#7d8a6a;background:rgba(125,138,106,.2);box-shadow:none;opacity:.5}
.klik.stil .mark{display:none}
/* personen: knop met eigen SVG-silhouet */
.persoon{position:absolute;cursor:pointer;background:transparent;border:0;padding:0}
.persoon svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 12px rgba(0,0,0,.65))}
.persoon:hover svg,.persoon:focus-visible svg{filter:drop-shadow(0 0 14px rgba(212,176,118,.5))}
.persoon:focus-visible{outline:none}
.persoon .naamkaart{
  position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:.14em;color:var(--messing-l);
  background:rgba(7,11,20,.9);border:1px solid rgba(184,147,90,.45);
  padding:2px 8px;border-radius:2px;white-space:nowrap;text-transform:uppercase;
}
/* coupé-interieur in overlay */
.coupescene{position:relative;width:100%;aspect-ratio:700/360;margin-top:12px}
.coupescene>svg{position:absolute;inset:0;width:100%;height:100%;display:block;border:1px solid rgba(184,147,90,.4);border-radius:3px;background:#0b0f1a}
.coupescene .klik{min-width:38px;min-height:38px}
.coupetekst{margin-top:12px}
/* melding */
#melding{
  position:absolute;left:50%;bottom:6%;transform:translateX(-50%) translateY(20px);
  max-width:min(88vw,540px);
  background:rgba(7,11,20,.94);border:1px solid rgba(184,147,90,.55);
  color:var(--papier);font-size:13px;line-height:1.5;
  padding:10px 16px;border-radius:2px;opacity:0;pointer-events:none;
  transition:opacity .25s, transform .25s;z-index:40;
}
#melding.zichtbaar{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- treinnav ---------- */
#treinnav{
  flex:0 0 auto;display:flex;align-items:flex-end;gap:4px;
  padding:8px 14px 12px;overflow-x:auto;
  background:linear-gradient(180deg,var(--nacht) 0%,#060910 100%);
  border-top:1px solid rgba(184,147,90,.3);
  scrollbar-width:thin;
}
#navloc{flex:0 0 auto;width:88px;height:48px}
#navloc svg{width:100%;height:100%;display:block}
.navwagon{
  flex:0 0 auto;min-width:96px;height:44px;position:relative;
  font-family:inherit;font-size:10px;letter-spacing:.08em;
  color:var(--papier);text-transform:uppercase;
  background:linear-gradient(180deg,#2e2415 0%,#1b1409 100%);
  border:1px solid rgba(184,147,90,.4);border-radius:4px;
  cursor:pointer;padding:4px 8px;
  display:flex;align-items:center;justify-content:center;text-align:center;
}
.navwagon::before,.navwagon::after{
  content:"";position:absolute;bottom:-5px;width:9px;height:9px;border-radius:50%;
  background:#0a0d14;border:1.5px solid rgba(184,147,90,.5);
}
.navwagon::before{left:14px}
.navwagon::after{right:14px}
.navwagon.actief{
  background:linear-gradient(180deg,#4a3a1e 0%,#2c2110 100%);
  box-shadow:0 0 14px rgba(212,176,118,.3), inset 0 0 0 1px rgba(212,176,118,.5);
  color:var(--messing-l);
}
.navwagon:hover,.navwagon:focus-visible{outline:none;box-shadow:inset 0 0 0 1px rgba(212,176,118,.6)}
/* ---------- overlay ---------- */
#overlay{
  position:fixed;inset:0;z-index:60;display:none;
  align-items:center;justify-content:center;
  background:rgba(4,6,11,.8);backdrop-filter:blur(2px);padding:18px;
}
#overlay.open{display:flex}
#overlaybox{
  width:min(700px,94vw);max-height:88vh;overflow-y:auto;
  background:linear-gradient(180deg,#121826 0%,#0b0f1a 100%);
  border:1px solid rgba(184,147,90,.55);border-radius:3px;
  padding:22px 24px 26px;position:relative;
  box-shadow:0 24px 70px rgba(0,0,0,.7);
}
#overlaybox h2{
  font-family:Georgia,serif;font-size:17px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--messing-l);margin-bottom:14px;
  border-bottom:1px solid rgba(184,147,90,.35);padding-bottom:8px;
}
#overlaysluit{
  position:absolute;top:10px;right:12px;
  font-family:inherit;font-size:16px;color:var(--messing-l);
  background:transparent;border:1px solid rgba(184,147,90,.45);
  border-radius:2px;width:34px;height:34px;cursor:pointer;
}
#overlaysluit:hover,#overlaysluit:focus-visible{background:rgba(184,147,90,.15);outline:none}
.papierdoc{
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.03) 0 1px, transparent 1px 26px),
    linear-gradient(160deg,var(--papier) 0%,var(--papier-d) 100%);
  color:var(--inkt);padding:20px 22px;border-radius:1px;
  font-size:13.5px;line-height:1.65;
  box-shadow:0 6px 20px rgba(0,0,0,.5);transform:rotate(-.35deg);
}
.papierdoc h3{
  font-family:Georgia,serif;font-size:14px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:10px;color:#3a2f1e;
}
.papierdoc .stempel{
  display:inline-block;margin-top:12px;padding:3px 10px;
  border:2px solid var(--stempel);color:var(--stempel);
  font-weight:bold;letter-spacing:.2em;font-size:11px;
  transform:rotate(-3deg);text-transform:uppercase;
}
.papierdoc em{font-style:italic}
.papierdoc td{padding:2px 10px 2px 0;vertical-align:top;font-size:12.5px}
.papierdoc u{text-decoration-color:#8e2a22}
.vraagknop{
  display:block;width:100%;text-align:left;
  font-family:inherit;font-size:13px;line-height:1.4;color:var(--papier);
  background:rgba(184,147,90,.07);border:1px solid rgba(184,147,90,.35);
  border-radius:2px;padding:9px 12px;margin-top:8px;cursor:pointer;
}
.vraagknop:hover,.vraagknop:focus-visible{background:rgba(184,147,90,.18);outline:none}
.vraagknop.gesteld{opacity:.55}
.antwoord{
  margin-top:10px;padding:12px 14px;font-size:13px;line-height:1.6;
  background:rgba(94,34,48,.16);border-left:3px solid var(--fluweel-l);
  color:var(--papier);font-style:italic;
}
.persoonrol{font-size:11.5px;color:#8fa0b8;letter-spacing:.1em;margin-bottom:10px}
#dossierlijst{list-style:none}
#dossierlijst li{
  padding:8px 10px;margin-top:6px;font-size:12.5px;line-height:1.45;
  background:rgba(233,221,192,.05);border:1px solid rgba(184,147,90,.25);
  border-radius:2px;cursor:pointer;
}
#dossierlijst li:hover{background:rgba(233,221,192,.1)}
#dossierlijst li b{color:var(--messing-l);letter-spacing:.05em}
.leegdossier{color:#7c8698;font-size:13px;font-style:italic;padding:8px 2px}
/* puzzels */
.slotrij{display:flex;gap:10px;justify-content:center;margin:18px 0}
.slotwiel{display:flex;flex-direction:column;align-items:center;gap:6px}
.slotwiel button{
  font-family:inherit;font-size:15px;color:var(--messing-l);
  background:rgba(184,147,90,.1);border:1px solid rgba(184,147,90,.45);
  width:44px;height:34px;cursor:pointer;border-radius:2px;
}
.slotwiel button:hover,.slotwiel button:focus-visible{background:rgba(184,147,90,.25);outline:none}
.slotcijfer{
  font-family:Georgia,serif;font-size:26px;color:var(--papier);
  width:44px;height:48px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#1c2434 0%,#10151f 100%);
  border:1px solid rgba(184,147,90,.55);border-radius:3px;
}
.flesrij{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0;justify-content:center}
.fles{
  font-family:inherit;font-size:11.5px;letter-spacing:.04em;color:var(--papier);
  background:transparent;border:0;cursor:pointer;text-align:center;width:96px;
}
.fles svg{width:54px;height:78px;display:block;margin:0 auto 6px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.fles:hover svg,.fles:focus-visible svg{filter:drop-shadow(0 0 10px rgba(212,176,118,.5))}
.fles:focus-visible{outline:none}
.fles.fout{opacity:.45}
.lijstkeuze{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.morsegroep{display:flex;flex-direction:column;gap:8px;align-items:center}
.morserij{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.morseteken{
  font-family:Georgia,serif;font-size:20px;letter-spacing:.3em;color:var(--messing-l);
  background:rgba(0,0,0,.35);border:1px solid rgba(184,147,90,.4);
  padding:8px 12px;border-radius:2px;min-width:86px;text-align:center;
}
.morsekeuzes{display:flex;gap:6px}
.morsekeuzes button{
  font-family:inherit;font-size:14px;color:var(--papier);
  background:rgba(184,147,90,.08);border:1px solid rgba(184,147,90,.4);
  width:36px;height:36px;cursor:pointer;border-radius:2px;
}
.morsekeuzes button:hover,.morsekeuzes button:focus-visible{background:rgba(184,147,90,.2);outline:none}
.morsekeuzes button.gekozen{background:rgba(94,34,48,.45);border-color:var(--fluweel-l)}
.tlpool,.tlvolg{list-style:none;margin-top:10px}
.tlpool li,.tlvolg li{
  font-size:12.5px;line-height:1.45;padding:8px 11px;margin-top:6px;
  background:rgba(233,221,192,.06);border:1px solid rgba(184,147,90,.3);
  border-radius:2px;cursor:pointer;
}
.tlpool li:hover,.tlvolg li:hover{background:rgba(233,221,192,.12)}
.tlvolg li{border-left:3px solid var(--messing)}
.tlvolg li .nr{color:var(--messing-l);margin-right:8px}
.pzfeedback{margin-top:12px;font-size:13px;min-height:20px}
.pzfeedback.goed{color:#9db87d}
.pzfeedback.fout{color:#d99a94}
.asblok{margin-top:14px}
.asblok .aslabel{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8fa0b8;margin-bottom:6px}
.askeuzes{display:flex;flex-wrap:wrap;gap:8px}
.askeuze{
  font-family:inherit;font-size:12.5px;color:var(--papier);
  background:rgba(184,147,90,.07);border:1px solid rgba(184,147,90,.35);
  border-radius:2px;padding:7px 12px;cursor:pointer;
}
.askeuze:hover,.askeuze:focus-visible{background:rgba(184,147,90,.18);outline:none}
.askeuze.gekozen{background:rgba(94,34,48,.4);border-color:var(--fluweel-l);color:#f0dfe2}
.hoofdknop{
  display:block;width:100%;margin-top:20px;
  font-family:Georgia,serif;font-size:14px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--nacht-d);background:linear-gradient(180deg,var(--messing-l) 0%,var(--messing) 100%);
  border:0;border-radius:2px;padding:12px;cursor:pointer;
}
.hoofdknop:hover,.hoofdknop:focus-visible{filter:brightness(1.1);outline:none}
.hoofdknop:disabled{opacity:.4;cursor:default;filter:none}
#stationsbalk{margin-top:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#stationsbalk .halte{
  font-size:10.5px;letter-spacing:.08em;color:#7c8698;
  border:1px solid rgba(143,160,184,.3);border-radius:2px;padding:3px 8px;
}
#stationsbalk .halte.gepasseerd{color:#d99a94;border-color:rgba(142,42,34,.6);text-decoration:line-through}
#stationsbalk .halte.eind{color:var(--messing-l);border-color:rgba(184,147,90,.5)}
.introtekst{font-size:13.5px;line-height:1.7;color:var(--papier)}
.introtekst p+p{margin-top:10px}
.eindtitel{font-family:Georgia,serif;font-size:22px;letter-spacing:.2em;text-transform:uppercase;text-align:center;margin:8px 0 16px}
.eindtitel.goed{color:#9db87d}
.eindtitel.fout{color:#d99a94}
@media (max-width:640px){
  #kop{gap:8px;padding:8px 10px 6px;flex-wrap:nowrap}
  #kop h1{font-size:11.5px;letter-spacing:.14em}
  #kop .route{display:none}
  #klok{font-size:12px;padding:2px 6px;letter-spacing:.08em}
  .kopknop{padding:4px 8px;font-size:10.5px}
  #overlaybox{padding:16px 14px 20px;max-height:86dvh}
  #overlaybox h2{font-size:14.5px;letter-spacing:.16em}
  .papierdoc{padding:14px 14px;font-size:12.5px}
  .persoon .naamkaart{font-size:9px}
  .slotwiel button{width:40px;height:32px}
  .slotcijfer{width:40px;height:44px;font-size:22px}
  .morseteken{min-width:72px;font-size:17px;padding:6px 8px}
  .morsekeuzes button{width:32px;height:32px}
  .fles{width:82px;font-size:10.5px}
  .navwagon{min-width:86px;height:40px;font-size:9px}
  #navloc{width:70px;height:40px}
  #melding{font-size:12px;max-width:92vw;bottom:4%}
}
</style>
</head>
<body>
<div id="app">
  <header id="kop">
    <h1>Nachttrein 212</h1>
    <span class="route">Amsterdam C.S. — Wenen Westbahnhof</span>
    <div class="rechts">
      <span id="klok">00:41</span>
      <button class="kopknop" id="knop-geluid" type="button" aria-pressed="false" title="Rijgeluid">&#9836;</button>
      <button class="kopknop" id="knop-dossier" type="button">Dossier</button>
      <button class="kopknop" id="knop-beschuldig" type="button">Beschuldiging</button>
      <button class="kopknop" id="knop-reset" type="button" title="Opnieuw instappen">&#8635;</button>
    </div>
  </header>
  <div id="scenewrap">
    <div id="schok"><div id="scene"></div></div>
    <div id="melding" role="status"></div>
  </div>
  <nav id="treinnav" aria-label="Wagons"><div id="navloc"></div></nav>
</div>
<div id="overlay" role="dialog" aria-modal="true">
  <div id="overlaybox">
    <button id="overlaysluit" type="button" aria-label="Sluiten">&times;</button>
    <div id="overlayinhoud"></div>
  </div>
</div>
<script>
/* ============================================================
   NACHTTREIN 212 — v2 · moord tussen Keulen en Koblenz
   ============================================================ */
const OPSLAG='nachttrein212_v2';
let S={
  wagon:'slaapB',
  gevonden:[],gesteld:{},
  kofferOpen:false,tasKlaar:false,tijdlijnKlaar:false,
  loper:false,morseKlaar:false,
  pogingen:0,intro:false,klaar:null
};
const STATIONS=['Frankfurt','W\u00fcrzburg','N\u00fcrnberg','Passau','WENEN'];

/* ============================================================
   SVG-BOUWSTENEN  (viewBox 1200 x 620)
   ============================================================ */
const DEFS=`<defs>

function deurSVG(x,y,w,h,nr,verzegeld){

    <rect x="${x-6}" y="${y-6}" width="${w+12}" height="${h+6}" rx="6" fill="#241708"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="url(#gDeur)"/>

    s+=`<g transform="rotate(-4 ${mid} ${y+h*.5})">
      <rect x="${x-14}" y="${y+h*.5-9}" width="${w+28}" height="18" fill="#8e2a22"/>
      <g fill="#e9ddc0"><rect x="${x-14}" y="${y+h*.5-9}" width="12" height="18"/><rect x="${x+10}" y="${y+h*.5-9}" width="12" height="18"/><rect x="${x+34}" y="${y+h*.5-9}" width="12" height="18"/><rect x="${x+58}" y="${y+h*.5-9}" width="12" height="18"/><rect x="${x+82}" y="${y+h*.5-9}" width="12" height="18"/><rect x="${x+106}" y="${y+h*.5-9}" width="12" height="18"/><rect x="${x+130}" y="${y+h*.5-9}" width="12" height="18"/><rect x="${x+154}" y="${y+h*.5-9}" width="12" height="18"/></g>

  return s+`</g>`;
}

function pct(x,y,w,h){return `left:${(x/1200*100).toFixed(2)}%;top:${(y/620*100).toFixed(2)}%;width:${(w/1200*100).toFixed(2)}%;height:${(h/620*100).toFixed(2)}%`;}
function klik(attrs,x,y,w,h,label,klasse){
  const done=attrs.startsWith('data-ev')&&S.gevonden.includes(attrs.split('"')[1])?' gedaan':'';
  return `<button class="klik${done}${klasse?' '+klasse:''}" style="${pct(x,y,w,h)}" ${attrs}>
    <span class="tip">${label}</span><span class="mark"></span></button>`;
}
function figuur(id,x,y,schaal){
  const w=90*(schaal||1),h=170*(schaal||1);
  return `<button class="persoon" style="${pct(x,y,w*1200/1200,h)};width:${(w/1200*100).toFixed(2)}%;min-width:52px" data-sus="${id}">
    ${FIG[id]}<span class="naamkaart">${SUS[id].naam}</span></button>`;
}

/* ---------------- COUPÉS ---------------- */
function knopje(ev,label){
  const done=S.gevonden.includes(ev)?' style="opacity:.55"':'';
  return `<button class="askeuze" data-ev="${ev}"${done}>${label}</button>`;
}
function pctC(x,y,w,h){return `left:${(x/700*100).toFixed(2)}%;top:${(y/360*100).toFixed(2)}%;width:${(w/700*100).toFixed(2)}%;height:${(h/360*100).toFixed(2)}%`;}
function klikC(attrs,x,y,w,h,label){
  const done=attrs.startsWith('data-ev')&&S.gevonden.includes(attrs.split('"')[1])?' gedaan':'';
  return `<button class="klik${done}" style="${pctC(x,y,w,h)}" ${attrs}>
    <span class="tip">${label}</span><span class="mark"></span></button>`;
}

/* ---------------- KERN ---------------- */
const $=s=>document.querySelector(s);
const scene=$('#scene');
const overlay=$('#overlay');
const overlayinhoud=$('#overlayinhoud');
let meldTimer=null;
function meld(t){
  const m=$('#melding');
  m.textContent=t;m.classList.add('zichtbaar');
  clearTimeout(meldTimer);
  meldTimer=setTimeout(()=>m.classList.remove('zichtbaar'),3800);
}
function bewaar(){try{localStorage.setItem(OPSLAG,JSON.stringify(S));}catch(e){}}
function laad(){try{const r=localStorage.getItem(OPSLAG);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}}
function heeft(eis){return S.gevonden.includes(eis)||S[eis]===true;}
function vind(id,stil){
  if(!S.gevonden.includes(id)){
    S.gevonden.push(id);bewaar();
    if(!stil)meld('Toegevoegd aan het dossier: '+EV[id].naam);
    return true;
  }
  return false;
}
function toonOverlay(html){
  overlayinhoud.innerHTML=html;
  overlay.classList.add('open');
  const f=overlayinhoud.querySelector('button,input,[tabindex]');
  if(f)f.focus();
}
function sluitOverlay(){overlay.classList.remove('open');}
function toonDocument(id){
  vind(id);
  toonOverlay(`<h2>${EV[id].naam}</h2>
    <div style="font-size:11px;color:#8fa0b8;letter-spacing:.1em;margin-bottom:10px">VINDPLAATS: ${EV[id].waar.toUpperCase()}</div>
    <div class="papierdoc">${EV[id].doc}</div>`);
  renderScene();
}
function renderScene(){
  scene.innerHTML=SCENES[S.wagon]();
  document.querySelectorAll('.navwagon').forEach(n=>n.classList.toggle('actief',n.dataset.wagon===S.wagon));
  /* in portret: begin in het midden van de wagon */
  (window.requestAnimationFrame||function(cb){setTimeout(cb,16);})(()=>{
    if(scene.scrollWidth>scene.clientWidth+4)scene.scrollLeft=(scene.scrollWidth-scene.clientWidth)/2;
  });
}
function renderNav(){
  $('#navloc').innerHTML=LOCSVG;
  const nav=$('#treinnav');
  WAGONS.forEach(w=>{
    const b=document.createElement('button');
    b.type='button';b.className='navwagon';b.dataset.wagon=w.id;b.textContent=w.naam;
    b.addEventListener('click',()=>{S.wagon=w.id;bewaar();renderScene();});
    nav.appendChild(b);
  });
}

/* ---------------- verhoor ---------------- */
function toonVerhoor(id){
  const p=SUS[id];
  const gesteld=S.gesteld[id]||[];
  let html=`<h2>${p.naam}</h2><div class="persoonrol">${p.rol}</div>`;
  p.vragen.forEach(v=>{
    const open=!v.eis||heeft(v.eis);
    if(!open){
      html+=`<button class="vraagknop" disabled style="opacity:.35;cursor:default">[ Hiervoor ontbreekt nog kennis of bewijs ]</button>`;
      return;
    }
    const was=gesteld.includes(v.id);
    html+=`<button class="vraagknop${was?' gesteld':''}" data-vraag="${v.id}" data-persoon="${id}">${v.v}</button>`;
    if(was)html+=`<div class="antwoord">${v.a}</div>`;
  });
  toonOverlay(html);
}
function stelVraag(pid,vid){
  const p=SUS[pid];
  const v=p.vragen.find(x=>x.id===vid);
  if(!v)return;
  S.gesteld[pid]=S.gesteld[pid]||[];
  if(!S.gesteld[pid].includes(vid))S.gesteld[pid].push(vid);
  if(v.geeft)vind(v.geeft,true);
  if(v.vlag){S[v.vlag]=true;renderScene();}
  bewaar();
  toonVerhoor(pid);
}

/* ---------------- dossier ---------------- */
function toonDossier(){
  let html=`<h2>Dossier</h2>`;
  if(!S.gevonden.length){
    html+=`<p class="leegdossier">Nog leeg. Doorzoek de wagons, spreek de passagiers.</p>`;
  }else{
    html+=`<ul id="dossierlijst">`+S.gevonden.map(id=>
      `<li data-doc="${id}"><b>${EV[id].naam}</b><br><span style="color:#8fa0b8;font-size:11px">${EV[id].waar}</span></li>`).join('')+`</ul>`;
  }
  html+=`<p style="margin-top:14px;font-size:11.5px;color:#7c8698">${S.gevonden.length} van ${Object.keys(EV).length} stukken \u00b7 ${S.tijdlijnKlaar?'reconstructie voltooid':'reconstructie nog open'} \u00b7 ${S.kofferOpen?'vioolkist geopend':'vioolkist dicht'}</p>`;
  toonOverlay(html);
}

/* ---------------- puzzel 1: vioolkist (code 1403) ---------------- */
let slot=[0,0,0,0];
const SLOTCODE=[1,4,0,3];
function toonKofferslot(){
  let html=`<h2>Vioolkist \u2014 cijferslot</h2>
    <p class="introtekst">Vier messing wieltjes, glimmend van dagelijks gebruik. Het fluweel onder het deksel bolt iets op. Welke vier cijfers draagt iemand op het hart?</p>
    <div class="slotrij">`;
  for(let i=0;i<4;i++){
    html+=`<div class="slotwiel">
      <button type="button" data-slot="${i}" data-richting="1">&#9650;</button>
      <div class="slotcijfer" id="slotc${i}">${slot[i]}</div>
      <button type="button" data-slot="${i}" data-richting="-1">&#9660;</button>
    </div>`;
  }
  html+=`</div>
    <button class="hoofdknop" type="button" data-actie="probeer-slot">Slot openen</button>
    <div class="pzfeedback" id="slotfb"></div>`;
  toonOverlay(html);
}
function draaiSlot(i,r){
  slot[i]=(slot[i]+r+10)%10;
  const el=document.getElementById('slotc'+i);
  if(el)el.textContent=slot[i];
}
function probeerSlot(){
  const fb=document.getElementById('slotfb');
  if(slot.join('')===SLOTCODE.join('')){
    S.kofferOpen=true;bewaar();
    if(fb){fb.textContent='Klik. Het deksel veert open.';fb.className='pzfeedback goed';}
    setTimeout(()=>toonDocument('flesje'),700);
  }else if(fb){
    const dag=slot[0]*10+slot[1];
    let hint='Het slot geeft niet mee.';
    if(slot.join('')==='2203')hint='Het slot geeft niet mee. De concertdatum is een datum voor de wereld \u2014 niet de datum die zij bewaart.';
    else if(dag>=1&&dag<=31)hint='Het slot geeft niet mee. Een datum, ja \u2014 maar niet deze. Wat werd er twee keer onderstreept?';
    if(fb){fb.textContent=hint;fb.className='pzfeedback fout';}
  }
}

function startKlok(){
  const start=Date.now();
  const el=document.getElementById('klok');
  function tik(){
    const min=41+Math.floor((Date.now()-start)/60000);
    const u=(Math.floor(min/60))%24,m=min%60;
    el.textContent=String(u).padStart(2,'0')+':'+String(m).padStart(2,'0');
  }
  tik();setInterval(tik,5000);
}
let audioCtx=null,audioAan=false,audioTimer=null,ruisBuf=null;
function maakRuis(){
  const sr=audioCtx.sampleRate,b=audioCtx.createBuffer(1,sr*0.09,sr),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2);
  return b;
}
function klakklak(){
  if(!audioCtx)return;
  [0,0.14].forEach(off=>{
    const src=audioCtx.createBufferSource();src.buffer=ruisBuf;
    const f=audioCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=190+Math.random()*60;f.Q.value=1.4;
    const g=audioCtx.createGain();g.gain.value=0.16;
    src.connect(f);f.connect(g);g.connect(audioCtx.destination);
    src.start(audioCtx.currentTime+off);
  });
}
function toggleGeluid(){
  const k=document.getElementById('knop-geluid');
  try{
    if(!audioAan){
      if(!audioCtx){
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC){meld('Geluid wordt hier niet ondersteund.');return;}
        audioCtx=new AC();ruisBuf=maakRuis();
      }
      if(audioCtx.state==='suspended')audioCtx.resume();
      audioAan=true;audioTimer=setInterval(klakklak,1350);klakklak();
      k.setAttribute('aria-pressed','true');
    }else{
      audioAan=false;clearInterval(audioTimer);
      k.setAttribute('aria-pressed','false');
    }
  }catch(e){meld('Geluid wordt hier niet ondersteund.');}
}
function planSchok(){
  const el=document.getElementById('schok');
  function zet(){
    el.classList.add('wissel');
    setTimeout(()=>el.classList.remove('wissel'),600);
    if(audioAan&&audioCtx){klakklak();setTimeout(klakklak,180);}
    setTimeout(zet,12000+Math.random()*16000);
  }
  setTimeout(zet,9000);
}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-doc],[data-tl-kies],[data-tl-terug]');
  if(!t)return;
  if(t.id==='knop-dossier'){toonDossier();return;}
  if(t.id==='knop-beschuldig'){toonBeschuldiging();return;}
  if(t.id==='knop-geluid'){toggleGeluid();return;}
  if(t.id==='knop-reset'){
    toonOverlay(`<h2>Opnieuw instappen?</h2><p class="introtekst">Alle vondsten, verhoren en de reconstructie gaan verloren.</p>
      <button class="hoofdknop" type="button" data-actie="herstart">Ja, begin opnieuw</button>`);
    return;
  }
  if(t.id==='overlaysluit'){sluitOverlay();return;}
  const d=t.dataset;
  if(d.actie==='start'){
    sluitOverlay();
    if(window.innerHeight>window.innerWidth*1.02)meld('Veeg horizontaal om de hele wagon te bekijken.');
    return;
  }
  if(d.actie==='herstart'){herstart();return;}
  if(d.actie==='kofferslot'){toonKofferslot();return;}
  if(d.actie==='probeer-slot'){probeerSlot();return;}
  if(d.actie==='tl-controle'){tlControle();return;}
  if(d.actie==='morse-controle'){morseControle();return;}
  if(d.actie==='beschuldig'){beschuldig();return;}
  if(d.actie==='terug-beschuldiging'){toonBeschuldiging();return;}
  if(d.slot!==undefined){draaiSlot(+d.slot,+d.richting);return;}
  if(d.ampul){kiesAmpul(d.ampul,t);return;}
  if(d.morse!==undefined){morseKeuze[+d.morse]=d.letter;toonTelegraaf();return;}
  if(d.as){keuze[d.as]=d.keuze;toonBeschuldiging();return;}
  if(d.vraag){stelVraag(d.persoon,d.vraag);return;}
  if(d.doc){toonDocument(d.doc);return;}
  if(d.tlKies){tlKeuze.push(d.tlKies);toonTijdlijn();return;}
  if(d.tlTerug){tlKeuze=tlKeuze.filter(x=>x!==d.tlTerug);toonTijdlijn();return;}
  if(d.sus){toonVerhoor(d.sus);return;}
  if(d.coupe){const c=COUPES[d.coupe];toonOverlay(`<h2>${c.titel}</h2>`+c.html());return;}
  if(d.koffer){kiesKoffer(d.koffer);return;}
  if(d.ev){
    if(d.ev==='medtas'){toonMedTas();return;}
    if(d.ev==='telegraaf'){toonTelegraaf();return;}
    if(d.ev==='tijdlijn'){toonTijdlijn();return;}
    if(d.ev==='tafelzes'){
      if(!S.tafelzes_gezien){S.tafelzes_gezien=true;bewaar();}
      meld('Tafel zes. Geen glas, geen bord \u2014 wel een stoel die schuin naar de gang staat, en naar de tafel van de dokter. Vraag Lotte wie hier zat.');
      return;
    }
    toonDocument(d.ev);return;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&overlay.classList.contains('open'))sluitOverlay();
});

/* ---------------- init ---------------- */
laad();
renderNav();
renderScene();
startKlok();
planSchok();
if(S.klaar)toonEinde();
else if(!S.intro)toonIntro();

/* test-API */
window.__NT={
  get S(){return S;},set S(v){S=v;},
  EV,SUS,TL,ASSEN,MORSE,
  get slot(){return slot;},set slot(v){slot=v;},
  get tlKeuze(){return tlKeuze;},set tlKeuze(v){tlKeuze=v;},
  get morseKeuze(){return morseKeuze;},set morseKeuze(v){morseKeuze=v;},
  get keuze(){return keuze;},set keuze(v){keuze=v;},
  renderScene,toonDocument,toonVerhoor,stelVraag,toonDossier,
  toonKofferslot,probeerSlot,toonMedTas,kiesAmpul,toonTelegraaf,morseControle,
  kiesKoffer,toonTijdlijn,tlControle,toonBeschuldiging,beschuldig,toonEinde,herstart,
  sluitOverlay,heeft,vind
};
</script>
